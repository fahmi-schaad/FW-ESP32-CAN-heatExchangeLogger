# Lovelace dashboard (YAML mode) for the heat exchanger logger: live values,
# condition KPIs and diagnostics.
# Shows only what this installation delivers: the heat meter (M-Bus) reports no
# data, so power, flow, energy and the heat transfer capacity (UA = P / LMTD) are
# not on the dashboard. The HA package still defines them; add the cards back
# once the meter reports (git history of this file).
# Register it in configuration.yaml (see homeassistant/README.md):
#   lovelace:
#     dashboards:
#       heat-exchanger:
#         mode: yaml
#         title: Heat exchanger
#         icon: mdi:heat-wave
#         show_in_sidebar: true
#         filename: dashboards/heat_exchanger.yaml

title: Heat exchanger
views:
  - title: Overview
    path: overview
    icon: mdi:heat-wave
    cards:
      - type: glance
        title: Now
        columns: 4
        entities:
          - entity: sensor.infrastruktur_heat_exchanger_logger_heat_generator_status
            name: Status
          - entity: sensor.infrastruktur_heat_exchanger_logger_heat_generator_temperature
            name: Heat generator
          - entity: sensor.heat_exchanger_effectiveness
            name: Effectiveness
          - entity: binary_sensor.heat_exchanger_active
            name: Active

      # Same names and order as the HovalConnect station overview.
      - type: entities
        title: Temperatures
        entities:
          - entity: sensor.heat_exchanger_logger_primary_inlet_temperature
            name: Primary supply
          - entity: sensor.heat_exchanger_logger_primary_outlet_temperature
            name: Primary return
          - entity: sensor.heat_exchanger_logger_secondary_outlet_temperature
            name: Secondary supply
          - entity: sensor.heat_exchanger_logger_secondary_inlet_temperature
            name: Secondary return
          - type: divider
          - entity: sensor.heat_exchanger_logger_primary_temperature_drop
            name: Primary ΔT
          - entity: sensor.heat_exchanger_logger_secondary_temperature_rise
            name: Secondary ΔT
          - entity: sensor.heat_exchanger_lmtd
            name: LMTD
          - entity: sensor.heat_exchanger_operating_time_today
            name: Operating time today

      # Further TopTronic values that exist on this installation (esphome/packages/hoval_plant.yaml).
      - type: entities
        title: Plant (TopTronic)
        entities:
          - entity: sensor.infrastruktur_heat_exchanger_logger_outdoor_temperature
            name: Outdoor (AF)
          - entity: sensor.infrastruktur_heat_exchanger_logger_district_heating_valve
            name: District heating valve (YFW)
          - entity: binary_sensor.infrastruktur_heat_exchanger_logger_return_temperature_limitation
            name: Return limitation
          - entity: binary_sensor.infrastruktur_heat_exchanger_logger_power_limitation
            name: Power limitation
          - type: divider
          - entity: sensor.infrastruktur_heat_exchanger_logger_heating_circuit_status
            name: Heating circuit
          - entity: sensor.infrastruktur_heat_exchanger_logger_heating_circuit_supply_temperature
            name: Heating circuit supply (VF1)
          - entity: sensor.infrastruktur_heat_exchanger_logger_heating_circuit_supply_setpoint
            name: Supply setpoint
          - entity: binary_sensor.infrastruktur_heat_exchanger_logger_heating_circuit_pump
            name: Heating pump (MK1)
          - entity: sensor.infrastruktur_heat_exchanger_logger_heating_circuit_mixer
            name: Mixer drive (YK1)
          - type: divider
          - entity: sensor.infrastruktur_heat_exchanger_logger_hot_water_status
            name: Hot water
          - entity: sensor.infrastruktur_heat_exchanger_logger_hot_water_temperature
            name: Hot water (SF1)
          - entity: sensor.infrastruktur_heat_exchanger_logger_hot_water_setpoint
            name: Hot water setpoint
          - entity: binary_sensor.infrastruktur_heat_exchanger_logger_hot_water_charging_pump
            name: Charging pump (SLP1)

      - type: history-graph
        title: Plant temperatures (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.heat_exchanger_logger_primary_inlet_temperature
            name: Primary supply
          - entity: sensor.heat_exchanger_logger_primary_outlet_temperature
            name: Primary return
          - entity: sensor.heat_exchanger_logger_secondary_outlet_temperature
            name: Secondary supply
          - entity: sensor.heat_exchanger_logger_secondary_inlet_temperature
            name: Secondary return
          - entity: sensor.infrastruktur_heat_exchanger_logger_heat_generator_temperature
            name: Heat generator
          - entity: sensor.infrastruktur_heat_exchanger_logger_heating_circuit_supply_temperature
            name: Heating circuit supply (VF1)
          - entity: sensor.infrastruktur_heat_exchanger_logger_hot_water_temperature
            name: Hot water (SF1)
          - entity: sensor.infrastruktur_heat_exchanger_logger_outdoor_temperature
            name: Outdoor (AF)

  - title: Condition
    path: condition
    icon: mdi:wrench-clock
    cards:
      - type: statistics-graph
        title: Effectiveness, daily mean
        chart_type: line
        period: day
        days_to_show: 180
        stat_types: [mean]
        entities:
          - entity: sensor.heat_exchanger_effectiveness
            name: Effectiveness

      - type: statistics-graph
        title: Temperature differences, daily mean
        chart_type: line
        period: day
        days_to_show: 180
        stat_types: [mean]
        entities:
          - entity: sensor.heat_exchanger_logger_primary_temperature_drop
            name: Primary ΔT
          - entity: sensor.heat_exchanger_logger_secondary_temperature_rise
            name: Secondary ΔT
          - entity: sensor.heat_exchanger_lmtd
            name: LMTD

  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Logger
        entities:
          - entity: binary_sensor.heat_exchanger_logger_can_bus_receiving
            name: CAN bus receiving
          - entity: sensor.heat_exchanger_logger_can_frame_rate
            name: CAN frame rate
          - entity: binary_sensor.heat_exchanger_logger_heat_exchanger_signal_missing
            name: Signal missing
          - entity: sensor.heat_exchanger_logger_toptronic_last_warning
            name: TopTronic last warning
          - entity: switch.heat_exchanger_logger_can_candump_debug
            name: Candump debug (120 s)
          - entity: switch.heat_exchanger_logger_can_find_device_debug
            name: Find device debug (120 s)
          - type: divider
          - entity: sensor.heat_exchanger_logger_wifi_signal
          - entity: sensor.heat_exchanger_logger_uptime
          - entity: sensor.heat_exchanger_logger_firmware_version
          - entity: sensor.heat_exchanger_logger_ip_address
          - entity: button.heat_exchanger_logger_restart

      - type: history-graph
        title: CAN frame rate (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.heat_exchanger_logger_can_frame_rate
