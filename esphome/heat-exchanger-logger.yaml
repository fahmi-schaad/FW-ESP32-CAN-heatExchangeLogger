# ESP32 CAN heat exchanger logger — Hoval TopTronic E. Production firmware.
#
# Hardware: ESP32-WROOM-32 devkit + SN65HVD230 CAN transceiver, see docs/hardware.md
# Protocol: Hoval TopTronic E (50 kbit/s, 29-bit IDs), handled by the vendored
#           `toptronic` component (components/toptronic, see docs/hoval-toptronic.md)
# Build:    make compile / make upload / make logs   (see README.md)
#
# Polls ONLY the datapoints in the signal map below (hub option `presets: false`):
# read-only, no writable entities, minimal bus load.
# To browse all datapoints of the device while commissioning, flash
# heat-exchanger-logger-discovery.yaml instead.

substitutions:
  name: heat-exchanger-logger
  friendly_name: Heat Exchanger Logger

  # ---- Board pins (from docs/Schematic.pdf, sheets "Esp devkit" / "CanBus") ----
  can_tx_pin: GPIO22
  can_rx_pin: GPIO21
  # NORMAL: send our own GET requests. LISTENONLY: send nothing, only decode what
  # the installed Hoval gateway asks for (~40 datapoints, no heat meter).
  can_mode: NORMAL

  # ---- Hoval device on the bus ---------------------------------------------------
  # FW = district heating (heat exchanger station), WEZ = heat generator,
  # HK = heating circuit, MWA = energy meter module, ... (docs/hoval-toptronic.md)
  # Confirmed 2026-10-21: controller label "2-TopTronic E - FW", address 1 answers.
  hoval_device_type: FW
  hoval_device_addr: "1"
  # Our sender node id on the bus. NOT 0x481: that is the installed Hoval gateway.
  hoval_gateway_node_id: "0x48A"
  hoval_language: en
  hoval_presets: "false"

  # ---- Timing --------------------------------------------------------------------
  poll_interval: 30s          # GET request per signal (NORMAL mode only; LISTENONLY sends nothing)
  signal_timeout: 300s        # no answer for this long -> "unknown" in HA (Hoval gateway polls every 1-2 min)

  # ---- Signal map ------------------------------------------------------------------
  # TopTronic datapoint for each logger signal: function group, function number,
  # datapoint, wire type and the scale that turns the raw value into the unit.
  # Defaults: district heating (FW) heat meter (2) = function group 20, number 1.
  # Datapoint IDs: presets or the discovery firmware (docs/hoval-toptronic.md).
  # Unmapped signal: poll: never (the datapoint is then never requested).
  # Checked on the real system 2026-10-21: the heat meter (group 20, all 16 meters)
  # answers only zeros (no M-Bus data), so its signals are unmapped until it reports.
  # HovalConnect shows "Energie Station" (0,0,111 U32) and "Durchfluss Station"
  # (0,0,112 U32) as 0 too (2026-10-24).
  # Unmapped = 255,255,65535 + poll: never. (poll: never alone still reads once at
  # boot and would publish the meter's 0.) Meter (2) datapoint in each comment.
  heat_energy:  {group: 255, number: 255, datapoint: 65535, type: U32, scale: 1.0, poll: never}      # 20,1,0: kWh
  heat_power:   {group: 255, number: 255, datapoint: 65535, type: U32, scale: 0.1, poll: never}      # 20,1,1: kW
  flow_prim:    {group: 255, number: 255, datapoint: 65535, type: U32, scale: 0.001, poll: never}    # 20,1,2: m³/h (unit TBC)
  meter_status: {group: 255, number: 255, datapoint: 65535, type: U8, scale: 1.0, poll: never}       # 20,1,8: M-bus status byte
  # Temperatures: the datapoints HovalConnect reads for its station overview
  # ("Übersicht 193.10.1"), found by capturing its requests on 2026-10-24.
  # 1,0,3 (RLF) reads the same as 0,0,102: the RLF sits in the SECONDARY return.
  t_prim_in:    {group: 0, number: 0, datapoint: 105, type: S16, scale: 0.1, poll: "${poll_interval}"}  # °C, primary supply
  t_prim_out:   {group: 0, number: 0, datapoint: 101, type: S16, scale: 0.1, poll: "${poll_interval}"}  # °C, primary return
  t_sec_out:    {group: 0, number: 0, datapoint: 103, type: S16, scale: 0.1, poll: "${poll_interval}"}  # °C, sec. supply (= VF 1,0,2)
  t_sec_in:     {group: 0, number: 0, datapoint: 102, type: S16, scale: 0.1, poll: "${poll_interval}"}  # °C, sec. return (= RLF 1,0,3)

packages:
  board: !include packages/board.yaml
  canbus: !include packages/canbus.yaml
  heat_exchanger: !include packages/heat_exchanger.yaml
  hoval_plant: !include packages/hoval_plant.yaml
