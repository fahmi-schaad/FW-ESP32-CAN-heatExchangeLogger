# ESP32 CAN heat exchanger logger — Hoval TopTronic E. Production firmware.
#
# Hardware: ESP32-WROOM-32 devkit + SN65HVD230 CAN transceiver, see docs/hardware.md
# Protocol: Hoval TopTronic E (50 kbit/s, 29-bit IDs), handled by the vendored
#           `toptronic` component (components/toptronic, see docs/hoval-toptronic.md)
# Build:    make compile / make upload / make logs   (see README.md)
#
# Polls ONLY the datapoints in the signal map below (hub option `presets: false`):
# read-only, no writable entities, minimal bus load.
# To browse all datapoints of the device while commissioning, flash
# heat-exchanger-logger-discovery.yaml instead.

substitutions:
  name: heat-exchanger-logger
  friendly_name: Heat Exchanger Logger

  # ---- Board pins (from docs/Schematic.pdf, sheets "Esp devkit" / "CanBus") ----
  can_tx_pin: GPIO22
  can_rx_pin: GPIO21

  # ---- Hoval device on the bus ---------------------------------------------------
  # FW = district heating (heat exchanger station), WEZ = heat generator,
  # HK = heating circuit, MWA = energy meter module, ... (docs/hoval-toptronic.md)
  # TODO(hardware): confirm type and address on the TopTronic control panel.
  hoval_device_type: FW
  hoval_device_addr: "1"
  hoval_language: en
  hoval_presets: "false"

  # ---- Timing --------------------------------------------------------------------
  poll_interval: 30s          # GET request per signal
  signal_timeout: 150s        # no answer for this long -> "unknown" in HA

  # ---- Signal map ------------------------------------------------------------------
  # TopTronic datapoint for each logger signal: function group, function number,
  # datapoint, wire type and the scale that turns the raw value into the unit.
  # Defaults: district heating (FW) heat meter (2) = function group 20, number 1.
  # Datapoint IDs: presets or the discovery firmware (docs/hoval-toptronic.md).
  # Unmapped signal: poll: never (the datapoint is then never requested).
  # TODO(hardware): verify every entry against the TopTronic display.
  heat_energy:  {group: 20, number: 1, datapoint: 0, type: U32, scale: 1.0, poll: "${poll_interval}"}      # kWh
  heat_power:   {group: 20, number: 1, datapoint: 1, type: U32, scale: 0.1, poll: "${poll_interval}"}      # kW
  flow_prim:    {group: 20, number: 1, datapoint: 2, type: U32, scale: 0.001, poll: "${poll_interval}"}    # m³/h (unit TBC)
  meter_status: {group: 20, number: 1, datapoint: 8, type: U8, scale: 1.0, poll: "${poll_interval}"}       # M-bus status byte
  t_prim_in:    {group: 20, number: 1, datapoint: 4, type: S16, scale: 0.1, poll: "${poll_interval}"}      # °C, meter flow temp.
  t_prim_out:   {group: 20, number: 1, datapoint: 5, type: S16, scale: 0.1, poll: "${poll_interval}"}      # °C, meter return temp.
  t_sec_out:    {group: 0, number: 0, datapoint: 21059, type: S16, scale: 0.1, poll: "${poll_interval}"}   # °C, plant flow sensor
  t_sec_in:     {group: 255, number: 255, datapoint: 65535, type: S16, scale: 0.1, poll: never}            # °C, not mapped yet

packages:
  board: !include packages/board.yaml
  canbus: !include packages/canbus.yaml
  heat_exchanger: !include packages/heat_exchanger.yaml
