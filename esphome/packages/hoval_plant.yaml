# Further values of the Hoval TopTronic E FW controller that exist on THIS
# installation. Found on the real system on 2026-10-21 (candump of the Hoval
# gateway's scan + probe of datapoints 0-20 in groups 0, 1, 2, 10): only the
# datapoints below answer with real values. The heat exchanger signals
# (VF, RLF, ...) are in heat_exchanger.yaml (signal map).
#
# Terminal  Datapoint  Meaning
# AF        0,0,0      outdoor temperature
# VF1       1,1,2      mixed heating circuit 1 supply (controller numbering: circuit (2))
# SF1       2,0,4      hot water storage tank
# YFW       0,0,110    district heating valve position
# MK1/YK1   1,1,1020/1021  heating circuit pump / mixer drive (S8, -100..100 %)
# SLP1      2,0,1066   hot water charging pump
# -         10,1,7     heat generator actual ("Wärmeerzeuger-Ist" in HovalConnect)
# -         10,1,2053  heat generator status ("Status Wärmeerzeuger")
# SF2 is wired but not found (2,0,5 and 2,1,4 read 0.0, 2,0,6 "not connected").
# Group 10 (heat generator) has number 1 only; 10,0,* does not answer (2026-10-24).

sensor:
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Outdoor temperature
    function_group: 0
    function_number: 0
    datapoint: 0
    type: S16
    update_interval: ${poll_interval}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: District heating valve
    function_group: 0
    function_number: 0
    datapoint: 110
    type: U8
    update_interval: ${poll_interval}
    unit_of_measurement: "%"
    icon: mdi:valve
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: "return x > 100 ? NAN : x;"
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Heat generator temperature
    function_group: 10
    function_number: 1
    datapoint: 7
    type: S16
    update_interval: ${poll_interval}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Heating circuit supply temperature
    function_group: 1
    function_number: 1
    datapoint: 2
    type: S16
    update_interval: ${poll_interval}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Heating circuit supply setpoint
    function_group: 1
    function_number: 1
    datapoint: 1002
    type: S16
    update_interval: ${poll_interval}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Heating circuit mixer
    function_group: 1
    function_number: 1
    datapoint: 1021
    # Signed (as in the HK preset; the FW preset's U8 is wrong): 3-point mixer
    # drive, + = opening, - = closing. 0xFE read on the plant = -2 % (2026-10-25).
    type: S8
    update_interval: ${poll_interval}
    unit_of_measurement: "%"
    icon: mdi:valve
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: "return (x < -100 || x > 100) ? NAN : x;"
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Hot water temperature
    function_group: 2
    function_number: 0
    datapoint: 4
    type: S16
    update_interval: ${poll_interval}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - timeout: ${signal_timeout}

  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Hot water setpoint
    function_group: 2
    function_number: 0
    datapoint: 1004
    type: S16
    update_interval: ${poll_interval}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - timeout: ${signal_timeout}

  # On/off states (U8 0/1), shown as binary sensors below.
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    id: hv_hc_pump
    internal: true
    function_group: 1
    function_number: 1
    datapoint: 1020
    type: U8
    update_interval: ${poll_interval}
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    id: hv_dhw_pump
    internal: true
    function_group: 2
    function_number: 0
    datapoint: 1066
    type: U8
    update_interval: ${poll_interval}
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    id: hv_return_limit
    internal: true
    function_group: 0
    function_number: 0
    datapoint: 98
    type: U8
    update_interval: ${poll_interval}
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    id: hv_power_limit
    internal: true
    function_group: 0
    function_number: 0
    datapoint: 99
    type: U8
    update_interval: ${poll_interval}
  # Heat generator status code, shown as text below.
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    id: hv_generator_status
    internal: true
    function_group: 10
    function_number: 1
    datapoint: 2053
    type: U8
    update_interval: ${poll_interval}

binary_sensor:
  - platform: template
    name: Heating circuit pump
    device_class: running
    lambda: |-
      if (isnan(id(hv_hc_pump).state)) return {};
      return id(hv_hc_pump).state > 0;
  - platform: template
    name: Hot water charging pump
    device_class: running
    lambda: |-
      if (isnan(id(hv_dhw_pump).state)) return {};
      return id(hv_dhw_pump).state > 0;
  - platform: template
    name: Return temperature limitation
    icon: mdi:thermometer-chevron-down
    lambda: |-
      if (isnan(id(hv_return_limit).state)) return {};
      return id(hv_return_limit).state > 0;
  - platform: template
    name: Power limitation
    icon: mdi:flash-alert
    lambda: |-
      if (isnan(id(hv_power_limit).state)) return {};
      return id(hv_power_limit).state > 0;

text_sensor:
  # No Hoval enum for 10,1,2053 in the presets or docs. 1 = "Heizen" in HovalConnect
  # (2026-10-24); other codes are shown as numbers until their meaning is known.
  - platform: template
    name: Heat generator status
    icon: mdi:fire
    update_interval: ${poll_interval}
    lambda: |-
      const float s = id(hv_generator_status).state;
      if (std::isnan(s)) return {};
      if (s == 0) return {"Off"};
      if (s == 1) return {"Heating"};
      return {"Code " + std::to_string((int) s)};
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Heating circuit status
    function_group: 1
    function_number: 1
    datapoint: 2051
    update_interval: ${poll_interval}
    options: ['Off', 'Heating normal', 'Heating comfort', 'Heating eco', 'Frost protection', 'Holiday', 'Party',
              'Cooling normal', 'Cooling comfort', 'Cooling eco', 'FAULT', 'Manual mode', 'Protection cooling',
              'Cooling external/constant', 'Heating external/constant', 'SmartGrid priority']
    values: [0, 1, 2, 3, 4, 7, 8, 9, 10, 11, 12, 13, 14, 22, 23, 26]
  - platform: toptronic
    toptronic_id: hoval
    ignore_extended: true  # 0x56 records carry limits, not values
    name: Hot water status
    function_group: 2
    function_number: 0
    datapoint: 2052
    update_interval: ${poll_interval}
    options: ['Off', 'Charging normal', 'Charging comfort', 'FAULT', 'Draw-off', 'Charging reduced',
              'SmartGrid priority', 'SmartGrid forced']
    values: [0, 1, 2, 5, 6, 8, 12, 13]
