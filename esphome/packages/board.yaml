# ESP32 board, connectivity and device diagnostics (shared by all firmware variants).
# Expects substitutions: name, friendly_name

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: fahmi-schaad.heat-exchanger-logger
    version: "0.3.0"

# Hoval TopTronic protocol component: vendored upstream + local patches.
# Never edit components/toptronic by hand, see tools/vendor_toptronic.sh.
external_components:
  - source:
      type: local
      path: components   # relative to esphome/ (the main config dir)
    components: [toptronic]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    # Keep the log readable: don't echo every one of the ~250 preset sensor publishes.
    sensor: INFO
    binary_sensor: INFO
    text_sensor: ERROR
    # Upstream advice: canbus below INFO can crash (esphome/issues#4051).
    canbus: ERROR
    # DEBUG shows every [GET]/[RES]/[SET] frame, useful while mapping datapoints.
    toptronic: INFO
  on_message:
    - level: WARN
      then:
        - lambda: |-
            if (strcmp(tag, "toptronic") == 0) {
              // Drop the ANSI color codes (ESC[...m) the logger adds to the message.
              std::string clean;
              for (const char *p = message; *p; p++) {
                if (*p == '\033') {
                  while (*p && *p != 'm') p++;
                  if (!*p) break;
                  continue;
                }
                clean += *p;
              }
              id(toptronic_last_warning).publish_state(clean);
            }

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Encrypted & authenticated with the api encryption key (inherited).
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if the configured network is unreachable (captive portal to reconfigure).
  ap:
    ssid: "${name}"
    password: !secret fallback_ap_password

captive_portal:

# Local status page on http://<device>/ — useful during commissioning without HA.
web_server:
  port: 80
  version: 3
  # No firmware upload via the web page: it would bypass the OTA encryption.
  ota: false

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: Firmware version
    hide_timestamp: true
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: IP address
      entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: config
  - platform: safe_mode
    name: Restart (safe mode)
    entity_category: config

safe_mode:
